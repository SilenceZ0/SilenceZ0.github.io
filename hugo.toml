baseURL = "http://localhost:1313/"
locale = "es-ES"
defaultContentLanguage = "es"
title = "PelículasData"

enableRobotsTXT = true

# Las taxonomías del sitio. `decade` son las décadas y `pais` los países de
# origen: las dos salen del frontmatter de las fichas, sin que haya que
# escribir ninguna lista de páginas a mano.
[taxonomies]
  decade = "decades"
  pais = "paises"

[params]
  description = "Colección de películas que he visto"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[minify]
  disableXML = true

# La navegación principal: las pestañas de la barra superior. El orden sale del
# weight, y pageRef resuelve la URL contra la página de verdad de cada sección,
# así que los enlaces no están escritos a mano. Cambiar una pestaña es cambiar
# su bloque aquí; añadir una sección nueva es poner el suyo y crear sus
# plantillas.
[[menus.main]]
  name = "Inicio"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Películas"
  pageRef = "/peliculas"
  weight = 20

[[menus.main]]
  name = "Series"
  pageRef = "/series"
  weight = 30

[[menus.main]]
  name = "Especial"
  pageRef = "/especial"
  weight = 40
