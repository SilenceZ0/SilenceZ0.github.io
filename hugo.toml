baseURL = "http://localhost:1313/"
locale = "es-ES"
defaultContentLanguage = "es"
title = "PelículasData"

enableRobotsTXT = true

# Sin tildes en las URLs: «Ciencia ficción» es /generos/ciencia-ficcion/ y no
# /generos/ciencia-ficción/. Solo afecta a los slugs con acento, que hoy son
# los géneros; las carpetas de contenido ya son ASCII.
removePathAccents = true

# Las taxonomías del sitio. `decade` son las décadas, `pais` los países de
# origen y `genero` los géneros: las tres salen del frontmatter de las fichas,
# sin que haya que escribir ninguna lista de páginas a mano. Los tres campos se
# escriben en plural en el frontmatter (`decades:`, `paises:`, `generos:`),
# aunque el género delante tenga lista de un solo valor.
[taxonomies]
  decade = "decades"
  pais = "paises"
  genero = "generos"

[params]
  description = "Colección de películas que he visto"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[minify]
  disableXML = true

# La navegación principal: las pestañas de la barra superior. El orden sale del
# weight, y pageRef resuelve la URL contra la página de verdad de cada sección,
# así que los enlaces no están escritos a mano. Cambiar una pestaña es cambiar
# su bloque aquí; añadir una sección nueva es poner el suyo y crear sus
# plantillas.
[[menus.main]]
  name = "Inicio"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Películas"
  pageRef = "/peliculas"
  weight = 20

[[menus.main]]
  name = "Series"
  pageRef = "/series"
  weight = 30

[[menus.main]]
  name = "Especial"
  pageRef = "/especial"
  weight = 40
