{{- /*
  lightbox.html: el visor de fotogramas a pantalla completa.

  Es solo el markup; el comportamiento está en assets/js/lightbox.js. Se
  include una vez por página, normalmente al final del <article>.
*/ -}}
<div class="lightbox" data-lightbox aria-hidden="true" inert>
  <div class="lightbox-backdrop" data-lightbox-close></div>
  <button type="button" class="lightbox-close" data-lightbox-close aria-label="Cerrar lightbox">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
  <button type="button" class="lightbox-nav lightbox-prev" data-lightbox-prev aria-label="Fotograma anterior">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button type="button" class="lightbox-nav lightbox-next" data-lightbox-next aria-label="Fotograma siguiente">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
  <figure class="lightbox-figure">
    <img data-lightbox-img alt="" />
    <figcaption class="lightbox-counter">
      <span data-lightbox-current>1</span> / <span data-lightbox-total>1</span>
    </figcaption>
  </figure>
</div>
